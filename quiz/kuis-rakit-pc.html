  +(p?`<div class="card"><h2>${t.resT}</h2><p class="mu">${t.resI(M(p.m),p.i+1,p.q.length,p.ok)}</p><div class="row"><button class="pri" onclick="resume()">${t.resB(p.i+1)}</button><button onclick="drop()">${t.drop}</button></div></div>`:"")
  +ana()
  +wl()
  +(h.length?`<div class="card"><h2>${t.hist}</h2><p class="mu">${t.histI(h.length,best)}</p><table><tr><th>${t.tm}</th><th>${t.md}</th><th>${t.sc}</th></tr>${h.slice(0,10).map(x=>`<tr><td>${fmt(x.t)}</td><td>${M(x.m)}</td><td>${x.ok}/${x.n} (${Math.round(x.ok/x.n*100)}%)</td></tr>`).join("")}</table><div class="row" style="margin-top:10px"><button onclick="dlHist()">${t.dlH}</button><button onclick="clearHist()">${t.clH}</button></div></div>`:"")
}
const gs=k=>{const x=ST.stats[k];return Array.isArray(x)&&x.length>=3?x:null};
const weakIdx=()=>Object.keys(ST.stats).map(Number).filter(i=>D[i]&&gs(i)&&gs(i)[2]===0);
const SEC=c=>c<=13?0:c<=28?1:c<=39?2:c<=46?3:4;
const st=(a,c)=>a<3?0:c/a>=.8?1:c/a<.6?2:3;
function ana(){
  const t=T(),C2=CN(),cs={},ss={};let any=false;
  Object.keys(ST.stats).forEach(k=>{const x=gs(k),d=D[k];if(!x||!d)return;any=true;[[cs,d.c],[ss,SEC(d.c)]].forEach(([o,g])=>{o[g]=o[g]||[0,0];o[g][0]+=x[0];o[g][1]+=x[1]})});
  if(!any)return"";
  const lb=["—","💪 "+t.anS,"⚠️ "+t.anW,"👍 "+t.anO],pc=o=>Math.round(o[1]/o[0]*100);
  const srt=o=>Object.keys(o).sort((x,y)=>o[x][1]/o[x][0]-o[y][1]/o[y][0]);
  const rows=(o,nm)=>srt(o).map(g=>`<tr><td>${nm(g)}</td><td>${o[g][1]}/${o[g][0]} (${pc(o[g])}%)</td><td>${lb[st(o[g][0],o[g][1])]}</td></tr>`).join("");
  const W=srt(cs).filter(g=>st(cs[g][0],cs[g][1])===2).slice(0,3),G=srt(cs).filter(g=>st(cs[g][0],cs[g][1])===1).reverse().slice(0,3);
  const li=a=>a.length?a.map(g=>`${+g+1}. ${C2[g]} (${pc(cs[g])}%)`).join("<br>"):t.anN;
  return`<div class="card"><h2>📊 ${t.an}</h2><p><b>⚠️ ${t.anW}</b><br>${li(W)}</p><p><b>💪 ${t.anS}</b><br>${li(G)}</p>
  <table><tr><th>${t.anSec}</th><th>${t.anCor}</th><th>${t.anSt}</th></tr>${rows(ss,g=>t.sn[g])}</table>
  <details><summary>${t.anAll}</summary><table><tr><th>${t.ch}</th><th>${t.anCor}</th><th>${t.anSt}</th></tr>${rows(cs,g=>`${+g+1}. ${C2[g]}`)}</table></details>
  <p class="mu">${t.anNote}</p><button onclick="rstStats()">${t.anRs}</button></div>`}
let WS="w",WO=false;
function setWS(){WS=WS==="w"?"c":"w";WO=true;home()}
function wl(){
  const i=weakIdx();if(!i.length)return"";const t=T();
  const r=i.map(k=>{const x=gs(k);return{k,a:x[0],w:x[0]-x[1],v:V(k)}});
  r.sort(WS==="w"?(x,y)=>y.w-x.w||y.w/y.a-x.w/x.a||y.a-x.a||x.k-y.k:(x,y)=>x.k-y.k);
  return`<div class="card"><details ${WO?"open":""} ontoggle="WO=this.open" style="margin-top:0"><summary>${t.wl(r.length)}</summary>
  <div style="margin:10px 0"><button onclick="setWS()">${WS==="w"?t.wsW:t.wsC} ⇅</button></div>
  ${r.map(x=>`<p><b>${x.v.q}</b><br>✅ ${t.right}: ${x.v.o[0]}<br><span class="mu">${x.v.c} · ${t.wrg(x.w,x.a)}</span></p>`).join("")}</details></div>`}
function rstStats(){ask(T().c4,()=>{ST.stats={};save();home()})}
function snap(i){ST.prog={q:S.q,i,ok:S.ok,a:S.a,m:S.m};save()}
function ask(msg,fn){window._cb=fn;const o=document.createElement("div");o.id="dlg";o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50";o.innerHTML=`<div class="card" style="max-width:360px;margin:0"><p style="margin-top:0">${msg}</p><div class="row"><button class="pri" onclick="dlg(1)">${en()?"Continue":"Lanjutkan"}</button><button onclick="dlg(0)">${en()?"Cancel":"Batal"}</button></div></div>`;document.body.appendChild(o)}
function dlg(ok){const o=document.getElementById("dlg");if(o)o.remove();const f=window._cb;window._cb=null;if(ok&&f)f()}
function go(m){if(ST.prog)ask(T().c1,()=>start(m));else start(m)}
function start(m){
  let idx=D.map((_,i)=>i);if(m==="baru")idx=idx.filter(i=>i>=BASE&&i<ADV);if(m==="lanjut")idx=idx.filter(i=>i>=ADV);if(m==="acak")idx=sh(idx);if(m==="lemah")idx=sh(weakIdx());if(!idx.length)return;
  S={q:idx,i:0,ok:0,a:[],m};snap(0);show()}
function resume(){const p=ST.prog;S={q:p.q,i:p.i,ok:p.ok,a:p.a,m:p.m};show()}
function drop(){ask(T().c2,()=>{ST.prog=null;save();home()})}
function clearHist(){ask(T().c3,()=>{ST.hist=[];save();home()})}
function show(){
  VIEW="quiz";const t=T(),n=S.q.length,v=V(S.q[S.i]),o=sh(v.o.map((x,k)=>({t:x,k})));S.cur={v,o,done:false};
  $.innerHTML=`<div class="card"><div class="mu">${t.qOf(S.i+1,n,S.ok)}</div><div class="bar"><i style="width:${S.i/n*100}%"></i></div>
  <span class="tag">${v.c}</span><h2 style="margin-top:10px">${v.q}</h2><div id="o">${o.map((x,k)=>`<button class="opt" onclick="pick(${k})">${x.t}</button>`).join("")}</div><div id="fb"></div>
  <div style="margin-top:12px"><button onclick="home()">${t.pause}</button></div></div>`}
function pick(n){
  const t=T(),c=S.cur;if(c.done)return;c.done=true;const right=c.o[n].k===0;
  if(right)S.ok++;S.a.push({q:S.q[S.i],right});{const k=S.q[S.i],x=gs(k)||[0,0,1];ST.stats[k]=[x[0]+1,x[1]+(right?1:0),right?1:0]}
  [...document.querySelectorAll(".opt")].forEach((b,k)=>{b.disabled=true;if(c.o[k].k===0)b.classList.add("ok");else if(k===n)b.classList.add("no")});
  const last=S.i===S.q.length-1;
  if(last){S.t=Date.now();ST.hist.push({t:S.t,ok:S.ok,n:S.q.length,m:S.m});ST.hist=ST.hist.slice(-50);ST.prog=null;save()}
  else snap(S.i+1);
  document.getElementById("fb").innerHTML=`<div class="fb" style="background:${right?"var(--okb)":"var(--nob)"}">${right?t.ok:t.no} ${t.ans}: <b>${c.v.o[0]}</b><br><span class="mu">${ref(c.v.d)}</span></div><button class="pri" style="margin-top:12px;width:100%" onclick="${last?"end()":"S.i++;show()"}">${last?t.fin:t.next}</button>`}
function stats(){const per={};S.a.forEach(x=>{const c=D[x.q].c;per[c]=per[c]||[0,0];per[c][1]++;if(x.right)per[c][0]++});return per}
function txt(){
  const t=T(),C2=CN(),n=S.q.length,p=Math.round(S.ok/n*100),per=stats(),wrong=S.a.filter(x=>!x.right);
  let s=`${t.title} – ${M(S.m)}\n${fmt(S.t||Date.now())}\n${t.sc}: ${S.ok}/${n} (${p}%)\n\n${t.tx.pc}:\n`;
  s+=Object.keys(per).map(c=>`- ${C2[c]}: ${per[c][0]}/${per[c][1]}`).join("\n");
  s+=`\n\n${t.tx.wr} (${wrong.length}):\n`+(wrong.length?wrong.map((x,i)=>{const v=V(x.q);return`${i+1}. ${v.q}\n   ${t.right}: ${v.o[0]} (${ref(v.d)})`}).join("\n"):t.none);
  const h=ST.hist.slice(-10).reverse();
  s+=`\n\n${t.tx.last}:\n`+h.map(x=>`- ${fmt(x.t)} | ${M(x.m)} | ${x.ok}/${x.n} (${Math.round(x.ok/x.n*100)}%)`).join("\n");
  return s}
function toast(m){const e=document.getElementById("tm");if(e)e.textContent=m}
function copyFb(s){const a=document.createElement("textarea");a.value=s;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?T().copied:T().cfail)}
function copyRes(){const s=txt();if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>toast(T().copied),()=>copyFb(s));else copyFb(s)}
function saveFile(name,s){const b=new Blob([s],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function dlRes(){saveFile("hasil-"+T().file+"-"+new Date().toISOString().slice(0,10)+".txt",txt());toast(T().dled)}
function dlHist(){saveFile("riwayat-"+T().file+".txt",T().tx.hd+"\n\n"+ST.hist.slice().reverse().map(x=>`${fmt(x.t)} | ${M(x.m)} | ${x.ok}/${x.n} (${Math.round(x.ok/x.n*100)}%)`).join("\n"))}
function end(){
  VIEW="end";const t=T(),C2=CN(),n=S.q.length,per=stats(),p=Math.round(S.ok/n*100),wrong=S.a.filter(x=>!x.right);
  $.innerHTML=`<div class="card">${langBtn()}<h1>${t.res}</h1><p class="mu">${M(S.m)}</p><div class="big">${S.ok}/${n} <span class="mu" style="font-size:1rem">(${p}%)</span></div>
  <p>${p>=85?t.t1:p>=65?t.t2:t.t3}</p>
  <div class="row"><button onclick="copyRes()">${t.cp}</button><button onclick="dlRes()">${t.dl}</button></div><p id="tm" class="mu" aria-live="polite"></p>
  <div class="row"><button class="pri" onclick="go('urut')">${t.rs}</button><button onclick="go('acak')">${t.rr}</button></div><div class="row" style="margin-top:8px"><button onclick="home()">${t.menu}</button></div></div>
  <div class="card"><h2>${t.pc}</h2><table><tr><th>${t.ch}</th><th>${t.cor}</th></tr>${Object.keys(per).map(c=>`<tr><td>${+c+1}. ${C2[c]}</td><td>${per[c][0]}/${per[c][1]}</td></tr>`).join("")}</table></div>
  <div class="card"><details><summary>${t.wr} (${wrong.length})</summary>${wrong.map(x=>{const v=V(x.q);return`<p><b>${v.q}</b><br>${t.right}: ${v.o[0]} <span class="mu">(${ref(v.d)})</span></p>`}).join("")||`<p>${t.none}</p>`}</details></div>`}
load();save();applyL();home();
</script></body></html>
